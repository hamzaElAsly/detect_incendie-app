[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-incendie-edge-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["opencv-python>=4.10,<6", "requests>=2.32,<3", "python-dotenv>=1.1,<2", "ultralytics>=8.4,<9"]

[project.scripts]
detect-incendie-edge = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
